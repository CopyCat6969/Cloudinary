<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subir imagen a Cloudinary</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f1f5f9; margin:0; padding:40px; }
    .container { max-width:600px; margin:auto; background:white; padding:24px; border-radius:18px; box-shadow:0 10px 30px #0002; }
    input, button { width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px solid #cbd5e1; }
    button { background:#0284c7; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { background:#94a3b8; cursor:not-allowed; }
    img { max-width:100%; border-radius:14px; margin-top:18px; }
    .url { word-break:break-all; background:#e0f2fe; padding:12px; border-radius:10px; }
    .preview { margin:20px 0; text-align:center; }
    .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-top:30px; }
    .gallery img { width:100%; height:150px; object-fit:cover; border-radius:10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Subir imagen a Cloudinary</h1>
    <p>Selecciona una imagen y súbela usando el backend publicado en Vercel.</p>

    <form id="formUpload">
      <input type="file" id="imagen" name="imagen" accept="image/*" required />
      <button type="submit" id="btnSubir">Subir imagen</button>
    </form>

    <p id="estado"></p>
    <div id="preview" class="preview"></div>
    <div id="resultado"></div>
    <h2>Galería</h2>
    <div id="galeria" class="gallery"></div>
  </div>

  <script>
    const form = document.getElementById("formUpload");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");
    const previewDiv = document.getElementById("preview");
    const galeria = document.getElementById("galeria");
    const btnSubir = document.getElementById("btnSubir");

    const API_URL = "";

    let previewUrl = null;

    function cargarGaleria() {
      const urls = JSON.parse(localStorage.getItem("imagenes") || "[]");
      galeria.innerHTML = "";
      urls.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        galeria.appendChild(img);
      });
    }

    function mostrarVistaPrevia(archivo) {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      
      previewUrl = URL.createObjectURL(archivo);
      previewDiv.innerHTML = `<img src="${previewUrl}" alt="Vista previa" />`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      estado.textContent = "Subiendo imagen...";
      resultado.innerHTML = "";

      const archivo = document.getElementById("imagen").files[0];
      if (!archivo) return;

      const formData = new FormData();
      formData.append("imagen", archivo);

      try {
        const response = await fetch(`${API_URL}/api/upload`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Error desconocido");
        }

        estado.textContent = data.message;

        const urlOptimizada = data.url.replace("/upload/", "/upload/w_800,q_auto,f_auto/");

        resultado.innerHTML = `
          <h3>Imagen subida:</h3>
          <img src="${urlOptimizada}" alt="Imagen subida" />
          <p class="url">${urlOptimizada}</p>
        `;

        const urls = JSON.parse(localStorage.getItem("imagenes") || "[]");
        urls.push(urlOptimizada);
        localStorage.setItem("imagenes", JSON.stringify(urls));

        cargarGaleria();

      } catch (error) {
        estado.textContent = "Error: " + error.message;
      }
    });

    document.getElementById("imagen").addEventListener("change", (e) => {
      const archivo = e.target.files[0];
      if (!archivo) return;

      if (archivo.size > 5 * 1024 * 1024) {
        estado.textContent = "Error: La imagen no puede superar 5 MB";
        btnSubir.disabled = true;
        previewDiv.innerHTML = "";
        return;
      }

      btnSubir.disabled = false;
      estado.textContent = "";
      mostrarVistaPrevia(archivo);
    });

    cargarGaleria();
  </script>
</body>
</html>
